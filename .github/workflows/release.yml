name: OpenWav Auto Release (Windows 11, macOS Universal & Linux Distros)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows-11-x64
            cmake_args: ""
          - os: macos-14
            os_name: macOS-Universal
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"'
          - os: ubuntu-latest
            os_name: Linux-Distros-x64
            cmake_args: ""

    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID || secrets.APPLE_DEVELOPER_EMAIL || secrets.APPLE_USERNAME }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD || secrets.APPLE_SPECIFIC_PASSWORD || secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.MACOS_TEAM_ID || secrets.TEAM_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Build Dependencies (ALSA, X11, XCB, OpenGL, Freetype, Ninja, PkgConfig, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            xvfb \
            ladspa-sdk \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxrender-dev \
            libfontconfig1-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libx11-xcb-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build OWMB (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel 4

      - name: Build OWMB (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4 -- /v:m

      - name: Build OWMB (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4

      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "build_temp_keychain_pass" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "build_temp_keychain_pass" $KEYCHAIN_PATH

          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build_temp_keychain_pass" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Code Sign macOS Binaries (VST3, AU, Standalone)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_NAME != ''
        run: |
          echo "Signing macOS bundles with $MACOS_CERTIFICATE_NAME..."
          find build/OpenWav_artefacts \( -name "OWMB.vst3" -o -name "OWMB.component" -o -name "OWMB.app" \) | while read -r bundle; do
            echo "Signing $bundle..."
            codesign --force --deep --options runtime --timestamp \
              --entitlements entitlements.plist \
              --sign "$MACOS_CERTIFICATE_NAME" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Package Windows Release & Installer (.exe)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Remove-Item -Path "dist" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "dist\OWMB-Windows-11-x64" -Force
          Get-ChildItem -Path "build" -Recurse -Directory -Filter "OWMB.vst3" | Where-Object { $_.FullName -match 'Release' } | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64" -Recurse -Force }
          Get-ChildItem -Path "build" -Recurse -File -Filter "OWMB.exe" | Where-Object { $_.FullName -match 'Release' } | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\OWMB.exe" -Force }
          Get-ChildItem -Path "build" -Recurse -File -Filter "OpenWav Media Browser.exe" | Where-Object { $_.FullName -match 'Release' } | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\OWMB.exe" -Force }
          
          # Standalone unzipped EXEs for direct execution & Microsoft Store submission
          if (Test-Path "dist\OWMB-Windows-11-x64\OWMB.exe") {
              Copy-Item -Path "dist\OWMB-Windows-11-x64\OWMB.exe" -Destination "OWMB-MicrosoftStore-Standalone.exe" -Force
              Copy-Item -Path "dist\OWMB-Windows-11-x64\OWMB.exe" -Destination "OWMB.exe" -Force
          }

          # Build Installer executable (.exe) via Inno Setup
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          Write-Host "Running Inno Setup compiler: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          if (Test-Path "OWMB-Installer.exe") {
              Copy-Item -Path "OWMB-Installer.exe" -Destination "OWMB-MicrosoftStore-Installer.exe" -Force
          } else {
              Write-Error "OWMB-Installer.exe was not created."
              exit 1
          }

          # Build MSIX package (.msix)
          $makeappx = (Get-Command makeappx -ErrorAction SilentlyContinue).Source
          if (-not $makeappx) {
              $sdkPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -ErrorAction SilentlyContinue | Where-Object { $_.PSIsContainer }
              foreach ($sdk in $sdkPaths) {
                  $candidate = Join-Path $sdk.FullName "x64\makeappx.exe"
                  if (Test-Path $candidate) {
                      $makeappx = $candidate
                      break
                  }
              }
          }
          if ($makeappx) {
              Write-Host "Building MSIX Package via makeappx: $makeappx"
              if (-not (Test-Path "msix\Assets\Square44x44Logo.png")) {
                  & powershell -ExecutionPolicy Bypass -File "msix\generate_assets.ps1"
              }
              $msixLayout = "dist\OWMB-MSIX-Layout"
              Remove-Item -Path $msixLayout -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $msixLayout -Force | Out-Null
              Copy-Item -Path "dist\OWMB-Windows-11-x64\OWMB.exe" -Destination "$msixLayout\OWMB.exe" -Force
              Copy-Item -Path "msix\AppxManifest.xml" -Destination "$msixLayout\AppxManifest.xml" -Force
              Copy-Item -Path "msix\Assets" -Destination "$msixLayout\Assets" -Recurse -Force
              & $makeappx pack /d $msixLayout /p "OWMB.msix" /o
          } else {
              Write-Host "makeappx.exe not found. Skipping MSIX build."
          }

          # Package Zip file
          Compress-Archive -Path "dist\OWMB-Windows-11-x64\*" -DestinationPath "OWMB-Windows-11-x64.zip" -Force

      - name: Package macOS Release (.pkg and .dmg Installers)
        if: runner.os == 'macOS'
        run: |
          DIST_DIR="dist/OWMB-${{ matrix.os_name }}"
          PKG_STAGING="build/pkg_root_${{ matrix.os_name }}"
          PKG_NAME="OWMB-${{ matrix.os_name }}-Installer.pkg"
          DMG_INSTALLER_NAME="OWMB-${{ matrix.os_name }}-Installer.dmg"
          DMG_NAME="OWMB-${{ matrix.os_name }}.dmg"

          # Clean up previous artifacts and staging
          rm -rf "$DIST_DIR" "$PKG_STAGING"
          rm -f OWMB-${{ matrix.os_name }}*.dmg OWMB-${{ matrix.os_name }}*.pkg
          mkdir -p "$DIST_DIR"

          # Copy bundles from build artifacts (support both multi-config and single-config paths)
          copy_mac_bundle() {
            local rel_subpath="$1"
            local name="$2"
            if [ -d "build/OpenWav_artefacts/Release/$rel_subpath/$name" ]; then
              cp -R "build/OpenWav_artefacts/Release/$rel_subpath/$name" "$DIST_DIR/"
            elif [ -d "build/OpenWav_artefacts/$rel_subpath/$name" ]; then
              cp -R "build/OpenWav_artefacts/$rel_subpath/$name" "$DIST_DIR/"
            fi
          }

          copy_mac_bundle "VST3" "OWMB.vst3"
          copy_mac_bundle "AU" "OWMB.component"
          copy_mac_bundle "Standalone" "OWMB.app"
          
          # 1. Create Native macOS PKG Installer
          mkdir -p "$PKG_STAGING/Applications" \
                   "$PKG_STAGING/Library/Audio/Plug-Ins/VST3" \
                   "$PKG_STAGING/Library/Audio/Plug-Ins/Components"

          [ -d "$DIST_DIR/OWMB.app" ] && cp -R "$DIST_DIR/OWMB.app" "$PKG_STAGING/Applications/"
          [ -d "$DIST_DIR/OWMB.vst3" ] && cp -R "$DIST_DIR/OWMB.vst3" "$PKG_STAGING/Library/Audio/Plug-Ins/VST3/"
          [ -d "$DIST_DIR/OWMB.component" ] && cp -R "$DIST_DIR/OWMB.component" "$PKG_STAGING/Library/Audio/Plug-Ins/Components/"

          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$VERSION_TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              VERSION_TAG="${{ github.ref_name }}"
              VERSION_TAG="${VERSION_TAG#v}"
            else
              VERSION_TAG="1.0.0"
            fi
          fi

          INSTALLER_CERT=$(security find-identity -v 2>/dev/null | grep "Developer ID Installer:" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -n "$INSTALLER_CERT" ]; then
            echo "Signing PKG with Developer ID Installer certificate: $INSTALLER_CERT"
            pkgbuild --root "$PKG_STAGING" \
              --identifier "com.samplaman.owmb.pkg" \
              --version "$VERSION_TAG" \
              --install-location "/" \
              --sign "$INSTALLER_CERT" \
              "$PKG_NAME"
          else
            pkgbuild --root "$PKG_STAGING" \
              --identifier "com.samplaman.owmb.pkg" \
              --version "$VERSION_TAG" \
              --install-location "/" \
              "$PKG_NAME"
          fi

          # 2. Create DMG Disk Image Installer with shortcuts (containing signed App and Plugins)
          detach_existing_volumes() {
            local name="$1"
            hdiutil info 2>/dev/null | grep -E "/Volumes/${name}|/Volumes/OWMB" | awk '{print $1}' | while read -r dev; do
              if [ -n "$dev" ]; then
                echo "==> Detaching busy disk image device: $dev"
                hdiutil detach "$dev" -force 2>/dev/null || true
              fi
            done
            if [ -d "/Volumes/$name" ]; then
              echo "==> Detaching mountpoint: /Volumes/$name"
              hdiutil detach "/Volumes/$name" -force 2>/dev/null || true
            fi
          }

          create_dmg_with_retry() {
            local volname="$1"
            local src="$2"
            local out="$3"

            detach_existing_volumes "$volname"
            rm -f "$out"
            sync

            local max_attempts=4
            for ((try_idx=1; try_idx<=max_attempts; try_idx++)); do
              echo "==> Creating DMG Disk Image ($out, attempt $try_idx/$max_attempts)..."
              if hdiutil create -volname "$volname" -srcfolder "$src" -ov -format UDZO "$out"; then
                echo "==> DMG successfully created: $out"
                return 0
              fi
              echo "Warning: hdiutil create failed (attempt $try_idx/$max_attempts). Detaching lingering mounts, waiting, and retrying..."
              detach_existing_volumes "$volname"
              sleep 2
              sync
            done

            echo "ERROR: Failed to create DMG $out after $max_attempts attempts."
            return 1
          }

          ln -sfn /Applications "$DIST_DIR/Applications (Shortcut)"
          ln -sfn "/Library/Audio/Plug-Ins/VST3" "$DIST_DIR/VST3 Plugins (Shortcut)"
          ln -sfn "/Library/Audio/Plug-Ins/Components" "$DIST_DIR/AU Plugins (Shortcut)"

          create_dmg_with_retry "OWMB Installer" "$DIST_DIR" "$DMG_INSTALLER_NAME"
          cp -f "$DMG_INSTALLER_NAME" "$DMG_NAME"

          if [ -n "$MACOS_CERTIFICATE_NAME" ]; then
            echo "Signing DMG Installer with $MACOS_CERTIFICATE_NAME..."
            codesign --force --sign "$MACOS_CERTIFICATE_NAME" --timestamp "$DMG_INSTALLER_NAME"
            codesign --verify --verbose=2 "$DMG_INSTALLER_NAME"
            codesign --force --sign "$MACOS_CERTIFICATE_NAME" --timestamp "$DMG_NAME"
          fi

      - name: Notarize and Staple macOS Release (DMG, PKG, and App)
        if: runner.os == 'macOS'
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning ::Apple Notarization credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) not found in GitHub secrets. Release built without Apple notarization."
            exit 0
          fi

          staple_with_retry() {
            local target="$1"
            local max_attempts=8
            local delay=15
            echo "==> Stapling notarization ticket to $target..."
            for ((i=1; i<=max_attempts; i++)); do
              if xcrun stapler staple "$target"; then
                echo "==> Successfully stapled ticket to $target on attempt $i"
                return 0
              fi
              echo "Stapler attempt $i/$max_attempts failed (ticket still propagating in Apple CloudKit). Waiting ${delay}s before retry..."
              sleep $delay
            done
            echo "Warning: Could not staple ticket to $target after $max_attempts attempts. (The ticket is still registered on Apple servers)."
            return 0
          }

          echo "==> 1. Submitting OWMB-${{ matrix.os_name }}-Installer.dmg to Apple Notary Service..."
          xcrun notarytool submit "OWMB-${{ matrix.os_name }}-Installer.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "Waiting 10s for Apple CloudKit ticket replication..."
          sleep 10

          echo "==> 2. Stapling notarization ticket to DMG Installer..."
          staple_with_retry "OWMB-${{ matrix.os_name }}-Installer.dmg"
          cp "OWMB-${{ matrix.os_name }}-Installer.dmg" "OWMB-${{ matrix.os_name }}.dmg"

          INSTALLER_CERT=$(security find-identity -v 2>/dev/null | grep "Developer ID Installer:" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -n "$INSTALLER_CERT" ]; then
            echo "==> 3. Submitting OWMB-${{ matrix.os_name }}-Installer.pkg to Apple Notary Service..."
            xcrun notarytool submit "OWMB-${{ matrix.os_name }}-Installer.pkg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "==> 4. Stapling notarization ticket to PKG Installer..."
            staple_with_retry "OWMB-${{ matrix.os_name }}-Installer.pkg"
          fi

          echo "==> macOS Notarization & Stapling Completed Successfully!"

      - name: Package Linux Distros Release (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/OWMB-Linux-Distros-x64
          find build/OpenWav_artefacts -name "OWMB.vst3" -exec cp -R {} dist/OWMB-Linux-Distros-x64/ \; 2>/dev/null || true
          find build/OpenWav_artefacts -name "OWMB" -type f -exec cp {} dist/OWMB-Linux-Distros-x64/ \; 2>/dev/null || true
          cd dist/OWMB-Linux-Distros-x64
          tar -czvf ../../OWMB-Linux-Distros-x64.tar.gz .

      - name: Upload Linux Build Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64
          path: OWMB-Linux-Distros-x64.tar.gz

      - name: Upload Windows Build Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-Windows-11-x64
          path: |
            OWMB-Windows-11-x64.zip
            OWMB.exe
            OWMB-MicrosoftStore-Standalone.exe
            OWMB-Installer.exe
            OWMB-MicrosoftStore-Installer.exe
            OWMB.msix

      - name: Upload macOS Build Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-${{ matrix.os_name }}
          path: |
            OWMB-${{ matrix.os_name }}-Installer.pkg
            OWMB-${{ matrix.os_name }}-Installer.dmg
            OWMB-${{ matrix.os_name }}.dmg

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Windows-11-x64

      - name: Download macOS Universal Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-macOS-Universal

      - name: Download Linux Distros Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (github.ref == 'refs/heads/main' && '1.0.0') || github.ref_name }}
          name: OWMB ${{ github.event.inputs.tag_name || (github.ref == 'refs/heads/main' && '1.0.0') || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            OWMB.exe
            OWMB-Installer.exe
            OWMB-MicrosoftStore-Standalone.exe
            OWMB-MicrosoftStore-Installer.exe
            OWMB.msix
            OWMB-Windows-11-x64.zip
            OWMB-macOS-Universal-Installer.pkg
            OWMB-macOS-Universal-Installer.dmg
            OWMB-macOS-Universal.dmg
            OWMB-Linux-Distros-x64.tar.gz


