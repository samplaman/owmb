name: OpenWav Auto Release (Windows 11 & Linux Distros)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows-11-x64
          - os: ubuntu-latest
            os_name: Linux-Distros-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Build Dependencies (ALSA, X11, XCB, OpenGL, Freetype, Ninja, PkgConfig, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            xvfb \
            ladspa-sdk \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxrender-dev \
            libfontconfig1-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libx11-xcb-dev

      - name: Configure CMake (Linux - Ninja)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Wno-format-truncation -Wno-stringop-overflow -Wno-array-bounds"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build OWMB (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cmake --build build --parallel 4

      - name: Build OWMB (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4

      - name: Package Windows 11 Release (.zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\OWMB-Windows-11-x64" -Force
          Get-ChildItem -Path "build" -Recurse -Filter "OWMB.vst3" | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\" -Recurse -Force }
          Get-ChildItem -Path "build" -Recurse -Filter "OWMB.exe" | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\" -Force }
          Compress-Archive -Path "dist\OWMB-Windows-11-x64\*" -DestinationPath "OWMB-Windows-11-x64.zip" -Force

      - name: Package Linux Distros Release (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/OWMB-Linux-Distros-x64
          find build -name "OWMB.vst3" -exec cp -r {} dist/OWMB-Linux-Distros-x64/ \; || true
          find build -name "OWMB" -type f -exec cp {} dist/OWMB-Linux-Distros-x64/ \; || true
          tar -czvf OWMB-Linux-Distros-x64.tar.gz -C dist/OWMB-Linux-Distros-x64 .

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-${{ matrix.os_name }}
          path: |
            OWMB-Windows-11-x64.zip
            OWMB-Linux-Distros-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Windows-11-x64

      - name: Download Linux Distros Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          name: OWMB ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OWMB-Windows-11-x64.zip
            OWMB-Linux-Distros-x64.tar.gz
