name: OpenWav Auto Release (Windows 11, macOS & Linux Distros)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows-11-x64
          - os: macos-14
            os_name: macOS-Universal
          - os: ubuntu-latest
            os_name: Linux-Distros-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Build Dependencies (ALSA, X11, XCB, OpenGL, Freetype, Ninja, PkgConfig, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            xvfb \
            ladspa-sdk \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxrender-dev \
            libfontconfig1-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libx11-xcb-dev

      - name: Configure CMake (Linux - Ninja)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 -Wno-format-truncation -Wno-stringop-overflow -Wno-array-bounds"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build OWMB (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cmake --build build --parallel 4

      - name: Build OWMB (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4

      - name: Build OWMB (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Package Windows Release & Installer (.exe)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\OWMB-Windows-11-x64" -Force
          Get-ChildItem -Path "build" -Recurse -File -Filter "OWMB.vst3" | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\OWMB.vst3" -Force }
          Get-ChildItem -Path "build" -Recurse -File -Filter "OWMB.exe" | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\OWMB.exe" -Force }
          Get-ChildItem -Path "build" -Recurse -File -Filter "OpenWav Media Browser.exe" | ForEach-Object { Copy-Item -Path $_.FullName -Destination "dist\OWMB-Windows-11-x64\OWMB.exe" -Force }
          
          # Standalone unzipped EXEs for direct execution & Microsoft Store submission
          Copy-Item -Path "dist\OWMB-Windows-11-x64\OWMB.exe" -Destination "OWMB-MicrosoftStore-Standalone.exe" -Force
          Copy-Item -Path "dist\OWMB-Windows-11-x64\OWMB.exe" -Destination "OWMB.exe" -Force

          # Build Installer executable (.exe) via Inno Setup
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          Copy-Item -Path "OWMB-Installer.exe" -Destination "OWMB-MicrosoftStore-Installer.exe" -Force

          # Package Zip file
          Compress-Archive -Path "dist\OWMB-Windows-11-x64\*" -DestinationPath "OWMB-Windows-11-x64.zip" -Force

      - name: Package macOS Universal Release (.zip)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/OWMB-macOS-Universal
          find build -name "OWMB.vst3" -type d -exec cp -R {} dist/OWMB-macOS-Universal/ \; || true
          find build -name "OWMB.component" -type d -exec cp -R {} dist/OWMB-macOS-Universal/ \; || true
          find build -name "OWMB.app" -type d -exec cp -R {} dist/OWMB-macOS-Universal/ \; || true
          cd dist/OWMB-macOS-Universal && zip -r ../../OWMB-macOS-Universal.zip .

      - name: Package Linux Distros Release (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/OWMB-Linux-Distros-x64
          find build -name "OWMB.vst3" -type d -exec cp -r {} dist/OWMB-Linux-Distros-x64/ \; || true
          find build -path "*/Standalone/OWMB" -type f -exec cp {} dist/OWMB-Linux-Distros-x64/ \; || true
          tar -czvf OWMB-Linux-Distros-x64.tar.gz -C dist/OWMB-Linux-Distros-x64 .

      - name: Upload Linux Build Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64
          path: OWMB-Linux-Distros-x64.tar.gz

      - name: Upload Windows Build Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-Windows-11-x64
          path: |
            OWMB-Windows-11-x64.zip
            OWMB.exe
            OWMB-MicrosoftStore-Standalone.exe
            OWMB-Installer.exe
            OWMB-MicrosoftStore-Installer.exe

      - name: Upload macOS Build Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-macOS-Universal
          path: OWMB-macOS-Universal.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Windows-11-x64

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-macOS-Universal

      - name: Download Linux Distros Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          name: OWMB ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OWMB.exe
            OWMB-Installer.exe
            OWMB-MicrosoftStore-Standalone.exe
            OWMB-MicrosoftStore-Installer.exe
            OWMB-Windows-11-x64.zip
            OWMB-macOS-Universal.zip
            OWMB-Linux-Distros-x64.tar.gz

