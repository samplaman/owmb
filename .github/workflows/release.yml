name: OpenWav Auto Release (Windows 11 & Linux Distros)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows-11-x64
          - os: ubuntu-latest
            os_name: Linux-Distros-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Build Dependencies (ALSA, X11, XCB, OpenGL, Freetype, Ninja, PkgConfig)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libcurl4-openssl-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libxrender-dev \
            libfontconfig1-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libx11-xcb-dev

      - name: Configure CMake (Linux - Ninja)
        if: runner.os == 'Linux'
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build OWMB (VST3 Plugin & Standalone App)
        run: cmake --build build --config Release -j 4

      - name: Package Windows 11 Release (.zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\OWMB-Windows-11-x64" -Force
          Copy-Item -Path "build\OpenWav_artefacts\Release\VST3\OWMB.vst3" -Destination "dist\OWMB-Windows-11-x64\OWMB.vst3" -Recurse -Force
          Copy-Item -Path "build\OpenWav_artefacts\Release\Standalone\OWMB.exe" -Destination "dist\OWMB-Windows-11-x64\OWMB.exe" -Force
          Compress-Archive -Path "dist\OWMB-Windows-11-x64\*" -DestinationPath "OWMB-Windows-11-x64.zip" -Force

      - name: Package Linux Distros Release (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/OWMB-Linux-Distros-x64
          cp -r build/OpenWav_artefacts/Release/VST3/OWMB.vst3 dist/OWMB-Linux-Distros-x64/ 2>/dev/null || cp -r build/OpenWav_artefacts/VST3/OWMB.vst3 dist/OWMB-Linux-Distros-x64/ || true
          cp build/OpenWav_artefacts/Release/Standalone/OWMB dist/OWMB-Linux-Distros-x64/ 2>/dev/null || cp build/OpenWav_artefacts/Standalone/OWMB dist/OWMB-Linux-Distros-x64/ || true
          tar -czvf OWMB-Linux-Distros-x64.tar.gz -C dist/OWMB-Linux-Distros-x64 .

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OWMB-${{ matrix.os_name }}
          path: |
            OWMB-Windows-11-x64.zip
            OWMB-Linux-Distros-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Windows-11-x64

      - name: Download Linux Distros Artifacts
        uses: actions/download-artifact@v4
        with:
          name: OWMB-Linux-Distros-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OWMB ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OWMB-Windows-11-x64.zip
            OWMB-Linux-Distros-x64.tar.gz
